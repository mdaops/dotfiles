# Ayu Dark (palette from Shatur/neovim-ayu).
# Native tmux styling: no theme plugin required.
set -g mode-style "fg=#E6B450,bg=#304357"
set -g message-style "fg=#E6B450,bg=#304357"
set -g message-command-style "fg=#E6B450,bg=#304357"
set -g pane-border-style "fg=#304357"
set -g pane-active-border-style "fg=#E6B450"
set -g clock-mode-colour "#E6B450"

# Keep pane/status backgrounds transparent to Ghostty.
set -g allow-passthrough on
set -g window-style "bg=default"
set -g window-active-style "bg=default"
set -g status on
set -g status-style "fg=#BFBDB6,bg=default"
set -g status-justify left
set -g status-left-style default
set -g status-right-style default
set -g window-status-style "fg=#BFBDB6,bg=default"
set -g window-status-current-style "fg=#E6B450,bg=default"
set -g window-status-activity-style "fg=#FF8F40,bg=default"
set -g window-status-bell-style "fg=#F26D78,bg=default"
set -g window-status-separator " "
set -g window-status-format "#[fg=#0F131A,bg=default]#[fg=#BFBDB6,bg=#0F131A] #I #T #[fg=#0F131A,bg=default]"
set -g window-status-current-format "#[fg=#E6B450,bg=default]#[fg=#0B0E14,bg=#E6B450,bold] #I #T #[fg=#E6B450,bg=default,nobold]"

# Application, CPU, session, uptime, and battery status.
set -g status-right-length 150
set -g status-left-length 100
set -g status-left ""
set -g status-right "#[fg=#E6B450] #{pane_current_command} #[fg=#636A72]│#[fg=#AAD94C] CPU #{cpu_percentage} #[fg=#636A72]│#[fg=#D2A6FF] #S #[fg=#636A72]│#[fg=#FF8F40] #(uptime -p) #[fg=#636A72]│#[fg=#39BAE6] #{battery_icon} #{battery_percentage} "
