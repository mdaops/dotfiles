# Options to make tmux more pleasant
set -g mouse on
set -g default-terminal "tmux-256color"

# Prefix
unbind C-b
unbind-key o
set -g prefix C-Space
bind C-Space send-prefix

# General
set -g history-limit 30000
set -g base-index 1
set -g pane-base-index 1
set -s escape-time 0
set-window-option -g mode-keys vi
set-option -g renumber-windows on
set-option -g status-position top
set-option -g automatic-rename off

# Pane resizing
bind -r H resize-pane -L 10
bind -r J resize-pane -D 10
bind -r K resize-pane -U 10
bind -r L resize-pane -R 10

# Vi copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Splits in current path
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"

# TokyoNight Night (palette from folke/tokyonight.nvim).
# Native tmux styling: no theme plugin required.
set -g mode-style "fg=#7aa2f7,bg=#3b4261"
set -g message-style "fg=#7aa2f7,bg=#3b4261"
set -g message-command-style "fg=#7aa2f7,bg=#3b4261"
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"
set -g clock-mode-colour "#7aa2f7"

# Keep pane/status backgrounds transparent to Ghostty.
set -g allow-passthrough on
set -g window-style "bg=default"
set -g window-active-style "bg=default"
set -g status on
set -g status-style "fg=#a9b1d6,bg=default"
set -g status-justify left
set -g status-left-style default
set -g status-right-style default
set -g window-status-style "fg=#a9b1d6,bg=default"
set -g window-status-current-style "fg=#7aa2f7,bg=default"
set -g window-status-activity-style "fg=#e0af68,bg=default"
set -g window-status-bell-style "fg=#f7768e,bg=default"
set -g window-status-separator " "
set -g window-status-format "#[fg=#24283b,bg=default]#[fg=#a9b1d6,bg=#24283b] #I #T #[fg=#24283b,bg=default]"
set -g window-status-current-format "#[fg=#7aa2f7,bg=default]#[fg=#1a1b26,bg=#7aa2f7,bold] #I #T #[fg=#7aa2f7,bg=default,nobold]"

# Application, CPU, session, uptime, and battery status.
set -g status-right-length 150
set -g status-left-length 100
set -g status-left ""
set -g status-right "#[fg=#7aa2f7] #{pane_current_command} #[fg=#565f89]│#[fg=#9ece6a] CPU #{cpu_percentage} #[fg=#565f89]│#[fg=#bb9af7] #S #[fg=#565f89]│#[fg=#e0af68] #(uptime -p) #[fg=#565f89]│#[fg=#7dcfff] #{battery_icon} #{battery_percentage} "

run ~/.config/tmux/plugins/tmux-cpu/cpu.tmux
run ~/.config/tmux/plugins/tmux-battery/battery.tmux

# Plugins (for TPM)
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tpm'

# Sessionx
set -g @sessionx-bind 'o'
set -g @sessionx-window-mode 'on'
set -g @sessionx-x-path '~/dotfiles'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-filter-current 'false'
set -g @sessionx-preview-enabled 'true'

# fzf-url
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# Initialize TPM (keep at very bottom)
run '~/.config/tmux/plugins/tpm/tpm'
